name: Patch complex domain admission
on:
  push:
    branches:
      - fix/complex-real-continuous-domain
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Accept concrete Complex symtypes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/ModelingToolkitBase/src/utils.jl')
          s = p.read_text()
          old = 'T === Real || T === Number || T === Complex || T <: AbstractFloat'
          new = 'T === Real || T === Number || T <: Complex || T <: AbstractFloat'
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/ModelingToolkitBase/src/utils.jl
          git commit -m 'fix: accept concrete complex continuous domains'
          git push origin HEAD:fix/complex-real-continuous-domain
